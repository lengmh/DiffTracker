name: One-shot 0.7.2 package metadata

on:
  push:
    branches:
      - fix/0.7.2-clear-unavailable-baseline
    paths:
      - .github/workflows/one-shot-0.7.2-metadata.yml

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.7.2-clear-unavailable-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm version 0.7.2 --no-git-tag-version
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-0.7.2-metadata.yml
          git add package.json package-lock.json
          git commit -m "chore: bump version to 0.7.2"
          git push origin HEAD:fix/0.7.2-clear-unavailable-baseline
