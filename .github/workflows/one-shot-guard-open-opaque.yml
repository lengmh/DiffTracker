name: One-shot guard opaque baseline on open

on:
  push:
    branches:
      - fix/0.7.2-clear-unavailable-baseline
    paths:
      - .github/workflows/one-shot-guard-open-opaque.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.7.2-clear-unavailable-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keep opaque baseline quiet on document open
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/diffTracker.ts')
          s = p.read_text(encoding='utf-8')
          old = "        if (this.unresolvedBaselineFiles.has(filePath) ||\n            (this.snapshotInitialized && (!this.scanCoverage || this.scanCoverage !== this.ignoreFingerprint))) {\n            this.recordUnresolvedBaseline(filePath, 'Path was not covered by the baseline scan; before-image is unknown');\n            return;\n        }"
          new = "        const unresolvedReason = this.unresolvedBaselineFiles.get(filePath);\n        if (unresolvedReason && this.isStableUnsupportedBaselineReason(unresolvedReason)) {\n            // Opening an unchanged opaque-baseline resource is not evidence of a file change.\n            // Actual document/file change events still surface it for explicit review.\n            return;\n        }\n        if (unresolvedReason ||\n            (this.snapshotInitialized && (!this.scanCoverage || this.scanCoverage !== this.ignoreFingerprint))) {\n            this.recordUnresolvedBaseline(filePath, 'Path was not covered by the baseline scan; before-image is unknown');\n            return;\n        }"
          assert s.count(old) == 1, f'open guard target count={s.count(old)}'
          p.write_text(s.replace(old, new), encoding='utf-8')

          tpath = Path('test/tracker-safety.mjs')
          t = tpath.read_text(encoding='utf-8')
          old = "    assert.equal(await tracker.restorePersistedState(),'restored');assert.equal(pending(p),undefined);\n    await scan(p);assert.ok(pending(p)?.unavailableReason,'a post-baseline event must surface the unsupported path again');"
          new = "    assert.equal(await tracker.restorePersistedState(),'restored');assert.equal(pending(p),undefined);\n    tracker.onDocumentOpened(document(p));assert.equal(pending(p),undefined,'opening an unchanged opaque baseline must stay quiet');\n    await scan(p);assert.ok(pending(p)?.unavailableReason,'a post-baseline event must surface the unsupported path again');"
          assert t.count(old) == 1, f'regression target count={t.count(old)}'
          tpath.write_text(t.replace(old, new), encoding='utf-8')
      - run: npm run lint
      - run: npm test
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-guard-open-opaque.yml
          git add src/diffTracker.ts test/tracker-safety.mjs
          git commit -m "fix: keep opaque baselines quiet on document open"
          git push origin HEAD:fix/0.7.2-clear-unavailable-baseline
