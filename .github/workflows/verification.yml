name: Verification

on:
  push:
    branches:
      - main
      - fix/difftracker-060-review-safety
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:performance

  extension-host:
    name: VS Code Stable Host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Extension Host (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:host
      - name: Extension Host (Windows)
        if: runner.os == 'Windows'
        run: npm run test:host

  minimum-extension-host:
    name: VS Code 1.80 Host (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Extension Host (VS Code 1.80.2)
        env:
          DIFF_TRACKER_VSCODE_VERSION: 1.80.2
        run: xvfb-run -a npm run test:host

  installed-extension-host:
    name: Installed RC VSIX (Ubuntu Stable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Initialize isolated RC artifact directory
        shell: bash
        run: echo "RC_ARTIFACTS=$RUNNER_TEMP/difftracker-installed-rc-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify installed harness and final artifact guards
        run: node --test test/installed/harness.test.mjs test/installed/final-artifact.test.mjs
      - name: Build and identify the final-format candidate VSIX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RC_ARTIFACTS"
          VERSION="$(node -p "require('./package.json').version")"
          FINAL_VSIX="$RC_ARTIFACTS/code-diff-tracker-$VERSION.vsix"
          npm run package -- --out "$FINAL_VSIX"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "FINAL_VSIX=$FINAL_VSIX" >> "$GITHUB_ENV"
          echo "FINAL_VSIX_SHA256=$(sha256sum "$FINAL_VSIX" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Verify the exact candidate and pinned official 0.7.2
        run: node test/installed/artifacts.mjs --final "$RC_ARTIFACTS" "$FINAL_VSIX" "$VERSION" "$FINAL_VSIX_SHA256" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: First install, released upgrade and real installed activation recovery
        run: xvfb-run -a node test/installed/run.mjs "$RC_ARTIFACTS" --final "$FINAL_VSIX" "$VERSION" "$FINAL_VSIX_SHA256" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Validate final artifact evidence
        run: node test/installed/final-artifact.mjs "$RC_ARTIFACTS/installed-summary.json" "$FINAL_VSIX" "$VERSION" "$FINAL_VSIX_SHA256" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Keep PR acceptance evidence (DO NOT PUBLISH)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DO-NOT-PUBLISH-installed-rc-evidence
          path: ${{ env.RC_ARTIFACTS }}
          if-no-files-found: warn
          retention-days: 7

  downgrade-compatibility:
    name: Released 0.7.2 rejects Session V4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Verify released 0.7.2 blocks V4 without overwriting it
        shell: bash
        env:
          RELEASE_072_SHA: 8b57373d89f3649754eada0b924c0ff593ee6839
          DT_EXPECT_LEGACY_REJECTION: "1"
        run: |
          git show "${RELEASE_072_SHA}:src/diffTracker.ts" > "${RUNNER_TEMP}/diffTracker-0.7.2.ts"
          DT_SOURCE="${RUNNER_TEMP}/diffTracker-0.7.2.ts" node test/tracker-safety.mjs

  package:
    name: VSIX package
    needs: [quality, extension-host, minimum-extension-host, downgrade-compatibility, installed-extension-host]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run package -- --out code-diff-tracker.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: code-diff-tracker-vsix
          path: code-diff-tracker.vsix
          if-no-files-found: error
