name: PR11 bounded batch
on:
  pull_request:
    paths:
      - '.github/workflows/pr11-batch.yml'
      - 'scripts/pr11-batch.patch'
permissions:
  contents: write
jobs:
  batch:
    if: github.event.pull_request.number == 11 && github.event.pull_request.head.repo.full_name == 'lengmh/DiffTracker' && github.event.pull_request.head.ref == 'feat/0.8-s3-monitoring-scope-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify batch and reproduce findings before production changes
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if test -f scripts/pr11-batch.patch; then
            base64 --decode scripts/pr11-batch.patch | gzip -d > "$RUNNER_TEMP/pr11.patch"
            echo "d4afeb3c20a0e775cd6e568d345047c048dc812103df59de8fe6695cff9f9234  $RUNNER_TEMP/pr11.patch" | sha256sum -c -
            git apply --check "$RUNNER_TEMP/pr11.patch"
            git apply --include='test/*' "$RUNNER_TEMP/pr11.patch"
            npm run compile
            if DT_TEST_FILTER='PR11 FINAL' npm run test:tracker-safety > "$RUNNER_TEMP/pr11-red.log" 2>&1; then
              cat "$RUNNER_TEMP/pr11-red.log"
              echo 'Expected targeted regressions to fail against pre-fix production code'
              exit 1
            fi
            cat "$RUNNER_TEMP/pr11-red.log"
            grep -F '5/19 production tracker regressions passed' "$RUNNER_TEMP/pr11-red.log"
            git apply --exclude='test/*' "$RUNNER_TEMP/pr11.patch"
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify complete green batch
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm test | tee "$RUNNER_TEMP/pr11-green.log"
          npm run test:performance | tee "$RUNNER_TEMP/pr11-performance.log"
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr11-batch-test-evidence
          path: ${{ runner.temp }}/pr11-*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit tested batch on unchanged PR head
        if: steps.patch.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api repos/lengmh/DiffTracker/pulls/11 --jq '.head.sha')
          test "$current" = "$EXPECTED_HEAD"
          rm scripts/pr11-batch.patch
          git add src test docs scripts/pr11-batch.patch
          git -c user.name='lengmh' -c user.email='47114200+lengmh@users.noreply.github.com' commit -m 'fix(scope): close path identity and pending-scope review findings'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feat/0.8-s3-monitoring-scope-v4
