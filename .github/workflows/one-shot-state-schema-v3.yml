name: One-shot state schema compatibility
on:
  push:
    branches: [fix/0.7.2-clear-unavailable-baseline]
    paths:
      - .github/workflows/one-shot-state-schema-v3.yml
      - .github/scripts/patch-state-schema-v3.py
permissions:
  contents: write
concurrency:
  group: state-schema-patch
  cancel-in-progress: false
jobs:
  validate-and-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.7.2-clear-unavailable-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply schema migration and harness integration
        run: |
          cp src/diffTracker.ts "$RUNNER_TEMP/schema-before.ts"
          git show v0.7.1:src/diffTracker.ts > "$RUNNER_TEMP/released-0.7.1.ts"
          python .github/scripts/patch-state-schema-v3.py
          npm run compile
      - name: Confirm regression against previous V2 writer
        run: |
          set +e
          DT_SOURCE="$RUNNER_TEMP/schema-before.ts" DT_TEST_FILTER=SCHEMA-V3 timeout 90 node test/tracker-safety.mjs > "$RUNNER_TEMP/schema-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/schema-red.log"
          test "$result" -eq 1
          grep -q 'FAIL SCHEMA-V3 writes primary and backup' "$RUNNER_TEMP/schema-red.log"
      - name: Verify released 0.7.1 refuses V3 without rewriting session data
        run: |
          DT_SOURCE="$RUNNER_TEMP/released-0.7.1.ts" DT_EXPECT_LEGACY_REJECTION=1 DT_TEST_FILTER=SCHEMA-DOWNGRADE timeout 90 node test/tracker-safety.mjs 2>&1 | tee "$RUNNER_TEMP/schema-downgrade.log"
      - name: Lint and complete regression suite
        run: |
          npm run lint
          npm test 2>&1 | tee "$RUNNER_TEMP/schema-green.log"
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-schema-v3-compatibility
          path: |
            ${{ runner.temp }}/schema-red.log
            ${{ runner.temp }}/schema-green.log
            ${{ runner.temp }}/schema-downgrade.log
          if-no-files-found: ignore
      - name: Commit only validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/patch-state-schema-v3.py .github/workflows/one-shot-state-schema-v3.yml
          git add src/diffTracker.ts test/tracker-safety.mjs CHANGELOG.md
          git diff --cached --check
          git commit -m 'fix: version opaque session state as V3 with safe legacy migration'
          git push origin HEAD:fix/0.7.2-clear-unavailable-baseline
