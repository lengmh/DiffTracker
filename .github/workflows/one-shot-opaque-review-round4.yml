name: One-shot opaque review round 4

on:
  push:
    branches:
      - fix/0.7.2-clear-unavailable-baseline
    paths:
      - .github/workflows/one-shot-opaque-review-round4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.7.2-clear-unavailable-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python .github/scripts/patch-opaque-review-round4.py
      - run: npm run lint
      - run: npm test
      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-opaque-review-round4.yml
          git rm .github/scripts/patch-opaque-review-round4.py
          git add src/diffTracker.ts test/tracker-safety.mjs
          git commit -m "fix: preserve dirty and uncertain opaque reviews"
          git push origin HEAD:fix/0.7.2-clear-unavailable-baseline
