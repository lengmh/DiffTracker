name: One-shot run opaque baseline patch
# final retry: tests are green; force-remove patch helpers after they modify themselves

on:
  push:
    branches:
      - fix/0.7.2-clear-unavailable-baseline
    paths:
      - .github/workflows/one-shot-run-opaque-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.7.2-clear-unavailable-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python .github/scripts/fix-opaque-patch-runner.py
      - run: python .github/scripts/apply-opaque-baseline-v2.py
      - run: npm run lint
      - run: npm test
      - name: Commit opaque baseline fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-shot-run-opaque-patch.yml
          git rm -f .github/workflows/one-shot-opaque-baseline-state.yml
          git rm -f .github/scripts/apply-opaque-baseline-v2.py
          git rm -f .github/scripts/fix-opaque-patch-runner.py
          git add src/diffTracker.ts test/tracker-safety.mjs
          git commit -m "fix: persist and reconcile opaque baseline identities"
          git push origin HEAD:fix/0.7.2-clear-unavailable-baseline
