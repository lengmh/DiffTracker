name: One-shot opaque timestamp validation
on:
  push:
    branches: [fix/0.7.2-clear-unavailable-baseline]
    paths:
      - .github/workflows/one-shot-opaque-mtime.yml
      - .github/scripts/patch-opaque-mtime.py
permissions:
  contents: write
concurrency:
  group: opaque-mtime-patch
  cancel-in-progress: false
jobs:
  validate-and-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.7.2-clear-unavailable-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply timestamp fix and regression tests
        run: |
          cp src/diffTracker.ts "$RUNNER_TEMP/mtime-before.ts"
          python .github/scripts/patch-opaque-mtime.py
          npm run compile
      - name: Verify previous source rejects valid pre-epoch mtimes
        run: |
          set +e
          DT_SOURCE="$RUNNER_TEMP/mtime-before.ts" DT_TEST_FILTER=SCHEMA-MTIME timeout 90 node test/tracker-safety.mjs > "$RUNNER_TEMP/mtime-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/mtime-red.log"
          test "$result" -eq 1
          grep -q 'finite negative mtimes must not invalidate opaque identity' "$RUNNER_TEMP/mtime-red.log"
      - name: Lint and full regression suite
        run: |
          npm run lint
          npm test 2>&1 | tee "$RUNNER_TEMP/mtime-green.log"
      - name: Preserve timestamp verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opaque-mtime-red-green
          path: |
            ${{ runner.temp }}/mtime-red.log
            ${{ runner.temp }}/mtime-green.log
          if-no-files-found: ignore
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/patch-opaque-mtime.py .github/workflows/one-shot-opaque-mtime.yml
          git add src/diffTracker.ts test/state-schema-compatibility.mjs
          git diff --cached --check
          git commit -m 'fix: accept finite pre-epoch modification times in opaque state'
          git push origin HEAD:fix/0.7.2-clear-unavailable-baseline
