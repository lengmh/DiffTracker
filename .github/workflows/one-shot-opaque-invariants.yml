name: One-shot opaque invariant validation

on:
  push:
    branches: [fix/0.7.2-clear-unavailable-baseline]
    paths:
      - .github/workflows/one-shot-opaque-invariants.yml
      - .github/scripts/patch-opaque-invariants.py

permissions:
  contents: write

concurrency:
  group: opaque-invariant-patch
  cancel-in-progress: false

jobs:
  validate-and-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.7.2-clear-unavailable-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded source and harness changes
        run: |
          cp src/diffTracker.ts "$RUNNER_TEMP/opaque-before.ts"
          python .github/scripts/patch-opaque-invariants.py
          npm run compile
      - name: Verify regressions fail against the previous production source
        run: |
          set +e
          DT_SOURCE="$RUNNER_TEMP/opaque-before.ts" DT_TEST_FILTER=OPAQUE-INVARIANT timeout 180 node test/tracker-safety.mjs > "$RUNNER_TEMP/opaque-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/opaque-red.log"
          test "$result" -eq 1
          grep -q 'FAIL OPAQUE-INVARIANT scan repository/bom/dirty' "$RUNNER_TEMP/opaque-red.log"
          grep -q 'AssertionError' "$RUNNER_TEMP/opaque-red.log"
      - name: Lint and full production regressions
        run: |
          npm run lint
          npm test 2>&1 | tee "$RUNNER_TEMP/opaque-green.log"
      - name: Preserve red-green test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opaque-invariant-red-green
          path: |
            ${{ runner.temp }}/opaque-red.log
            ${{ runner.temp }}/opaque-green.log
          if-no-files-found: ignore
      - name: Commit only validated changes and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/patch-opaque-invariants.py .github/workflows/one-shot-opaque-invariants.yml
          git add src/diffTracker.ts test/tracker-safety.mjs CHANGELOG.md
          git diff --cached --check
          git commit -m 'fix: unify opaque baseline acceptance and reconciliation invariants'
          git push origin HEAD:fix/0.7.2-clear-unavailable-baseline
