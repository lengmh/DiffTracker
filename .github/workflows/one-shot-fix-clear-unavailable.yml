name: One-shot fix Clear unavailable baseline

on:
  push:
    branches:
      - fix/0.7.2-clear-unavailable-baseline
    paths:
      - .github/workflows/one-shot-fix-clear-unavailable.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.7.2-clear-unavailable-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch baseline handling and regressions
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('src/diffTracker.ts')
          s = source_path.read_text(encoding='utf-8')

          def replace_braced_block(text, signature, replacement):
              hits = [i for i in range(len(text)) if text.startswith(signature, i)]
              assert len(hits) == 1, f'{signature!r} count={len(hits)}'
              start = hits[0]
              brace = text.index('{', start)
              depth = 0
              end = None
              for i in range(brace, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              assert end is not None
              return text[:start] + replacement + text[end:]

          old_sig = '    private recordUnresolvedBaseline(filePath: string, reason: string): void '
          replacement = '''    private isStableUnsupportedBaselineReason(reason: string): boolean {
              return reason === 'File exceeds the 5 MiB limit' ||
                  reason === 'UTF-8 BOM files require encoding preservation and are read-only in this version' ||
                  reason === 'Binary content is unsupported' ||
                  reason === 'Unsupported text encoding (expected UTF-8)';
          }

          private recordUnresolvedBaseline(filePath: string, reason: string, publishReview = true): void {
              this.postBaselineUnknownFiles.delete(filePath);
              this.unresolvedBaselineFiles.set(filePath, reason);
              if (publishReview) {
                  this.markFileUnavailable(filePath, reason);
              } else {
                  this.deleteTrackedChange(filePath);
                  this.lineChanges.delete(filePath);
                  this.markLineChangesUpdated(filePath);
                  this.inlineViews.delete(filePath);
              }
              this.schedulePersistState();
          }'''
          s = replace_braced_block(s, old_sig, replacement)

          anchor = "'File disappeared during baseline scan; before-image is unknown'"
          anchor_pos = s.index(anchor)
          call = 'this.recordUnresolvedBaseline(uri.fsPath, reason);'
          call_pos = s.index(call, anchor_pos)
          assert call_pos - anchor_pos < 400
          line_start = s.rfind('\n', 0, call_pos) + 1
          indent = s[line_start:call_pos]
          inserted = "const publishReview = state.kind !== 'unavailable' || !this.isStableUnsupportedBaselineReason(reason);\n" + indent + 'this.recordUnresolvedBaseline(uri.fsPath, reason, publishReview);'
          s = s[:call_pos] + inserted + s[call_pos + len(call):]

          anchor = '// An unsupported or unreadable resource is a file-level'
          anchor_pos = s.index(anchor)
          block_start = s.rfind("                if (state.kind !== 'text') {", 0, anchor_pos)
          assert block_start >= 0 and anchor_pos - block_start < 200
          brace = s.index('{', block_start)
          depth = 0
          block_end = None
          for i in range(brace, len(s)):
              if s[i] == '{':
                  depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      block_end = i + 1
                      break
          assert block_end is not None
          rebuild_block = '''                if (state.kind !== 'text') {
                      // Stable unsupported resources can be accepted as an opaque baseline.
                      // They remain unresolved internally so a later file event can surface
                      // the path again without pretending Code Diff Tracker can decode it.
                      const reason = state.kind === 'unavailable'
                          ? state.reason
                          : 'File disappeared during baseline rebuild; before-image is unknown';
                      const publishReview = state.kind !== 'unavailable' || !this.isStableUnsupportedBaselineReason(reason);
                      this.recordUnresolvedBaseline(uri.fsPath, reason, publishReview);
                      return;
                  }'''
          s = s[:block_start] + rebuild_block + s[block_end:]

          loop_sig = '        for (const [filePath, reason] of this.unresolvedBaselineFiles) '
          restore_loop = '''        for (const [filePath, reason] of this.unresolvedBaselineFiles) {
              if (!this.isPathIgnored(vscode.Uri.file(filePath)) &&
                  !this.isStableUnsupportedBaselineReason(reason)) {
                  this.markFileUnavailable(filePath, reason);
              }
          }'''
          s = replace_braced_block(s, loop_sig, restore_loop)
          source_path.write_text(s, encoding='utf-8')

          test_path = Path('test/tracker-safety.mjs')
          t = test_path.read_text(encoding='utf-8')

          old = "    const binary=kind==='binary'||kind==='all-unsupported';\n    assert.equal(tracker.getGitPauseReason(p),undefined);\n    if(binary)assert.equal(pending(p),undefined);else assert.ok(pending(p)?.unavailableReason);"
          new = "    const quiet=kind==='binary'||kind==='all-unsupported'||kind==='bom'||kind==='oversized';\n    assert.equal(tracker.getGitPauseReason(p),undefined);\n    if(quiet)assert.equal(pending(p),undefined);else assert.ok(pending(p)?.unavailableReason);"
          assert t.count(old) == 1, f'rebuild immediate expectation count={t.count(old)}'
          t = t.replace(old, new)

          old = "    if(binary)assert.equal(pending(p),undefined);else assert.ok(pending(p)?.unavailableReason);\n    assert.equal(tracker.getReviewToken(p),undefined);"
          new = "    if(quiet)assert.equal(pending(p),undefined);else assert.ok(pending(p)?.unavailableReason);\n    assert.equal(tracker.getReviewToken(p),undefined);"
          assert t.count(old) == 1, f'rebuild restored expectation count={t.count(old)}'
          t = t.replace(old, new)

          marker = "test('DT-08 explicit baseline reset accepts the current dirty editor content',async()=>{"
          assert t.count(marker) == 1
          regression = r'''for(const kind of ['oversized','bom','invalid-utf8']) test(`DT-08 clear/reset accepts stable unsupported ${kind} without recreating an unavailable review`,async()=>{
              const p=file(`${kind}-clear.txt`),storage=file('storage');
              seed(p,'baseline','pending');await scan(p);
              if(kind==='oversized') faults.set(p,{size:6*1024*1024});
              else if(kind==='bom') fs.writeFileSync(p,Buffer.from([0xef,0xbb,0xbf,0x61]));
              else fs.writeFileSync(p,Buffer.from([0xc3,0x28]));
              await scan(p);assert.ok(pending(p)?.unavailableReason);
              tracker.storageUri=Uri.file(storage);listedFiles=[Uri.file(p)];
              assert.equal(await tracker.resetBaselineToCurrentState(),true);
              assert.equal(tracker.getBaselineState(),'ready');assert.equal(pending(p),undefined);
              assert.ok(tracker.unresolvedBaselineFiles.has(p));assert.equal(await tracker.flushPendingPersistence(),true);
              await tracker.dispose();tracker=new DiffTracker(Uri.file(storage));
              assert.equal(await tracker.restorePersistedState(),'restored');assert.equal(pending(p),undefined);
              await scan(p);assert.ok(pending(p)?.unavailableReason,'a post-baseline event must surface the unsupported path again');
              faults.delete(p);
          });
          for(const kind of ['oversized','bom']) test(`AUDIT-21 stopped Clear removes unavailable ${kind} review and unresolved baseline`,async()=>{
              const p=file(`${kind}-stopped-clear.txt`),storage=file('storage');
              seed(p,'baseline','pending');await scan(p);
              if(kind==='oversized') faults.set(p,{size:6*1024*1024});
              else fs.writeFileSync(p,Buffer.from([0xef,0xbb,0xbf,0x61]));
              await scan(p);assert.ok(pending(p)?.unavailableReason);
              tracker.storageUri=Uri.file(storage);tracker.stopRecording();
              assert.equal(await tracker.resetBaselineToCurrentState(),true);
              assert.equal(pending(p),undefined);assert.equal(tracker.unresolvedBaselineFiles.has(p),false);
              const saved=JSON.parse(disk(path.join(storage,'session-state.json')));
              assert.equal(saved.unresolvedBaselineFiles.length,0);assert.equal(saved.fileSnapshots.length,0);
              await tracker.dispose();tracker=new DiffTracker(Uri.file(storage));
              assert.equal(await tracker.restorePersistedState(),'restored');assert.equal(pending(p),undefined);
              faults.delete(p);
          });
          '''
          t = t.replace(marker, regression + marker)
          test_path.write_text(t, encoding='utf-8')
      - run: npm run lint
      - run: npm test
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-clear-unavailable.yml
          git add src/diffTracker.ts test/tracker-safety.mjs
          git commit -m "fix: clear stable unsupported baseline reviews"
          git push origin HEAD:fix/0.7.2-clear-unavailable-baseline
